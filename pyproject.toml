[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "std0-quant"
version = "0.1.0"
description = "Auditable behavioral reconstruction and quantitative research on Polymarket trader std0 (BTC Up/Down 5m). Phase 1: data infrastructure only."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "std0-quant" }]
dependencies = [
    "requests>=2.31",
    "websockets>=12.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "duckdb>=0.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "psutil>=5.9",
    "cryptography==50.0.1",
    "anthropic==2.3.0",
    "openai==3.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
